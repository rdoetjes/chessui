<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess UI (v5.19)</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <script src="wasm_exec.js"></script>
</head>
<body>
    <div id="wasm-status">WASM v5.19: LOADING...</div>
    <div id="app">
        <div class="sidebar left-sidebar">
            <div class="panel">
                <h2 class="label">Settings</h2>
                <div class="control-group">
                    <label>Style</label>
                    <select id="style-select">
                        <option value="standard">Standard</option>
                        <option value="classic">Classic</option>
                        <option value="modern">Modern</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Bot Level (ELO)</label>
	                    <select id="elo-select">
	                        <option value="100">100 – 200</option>
	                        <option value="300">300 – 400</option>
	                        <option value="500">500 – 600</option>
	                        <option value="700">700 – 800</option>
	                        <option value="900">900 – 1000</option>
	                        <option value="1100">1100 – 1200</option>
	                        <option value="1300">1300 – 1400</option>
	                        <option value="1500">1500 – 1600</option>
	                        <option value="1700">1700 – 1800</option>
	                        <option value="1900">1900 – 2000</option>
	                        <option value="2100">2100 – 2200</option>
	                        <option value="2300">2300 – 2400</option>
	                        <option value="2500">2500 – 2600</option>
	                        <option value="2700">2700 – 2800+</option>
	                    </select>
                </div>
                <div id="setup-controls" class="control-group hidden">
                    <label>Whose Turn?</label>
                    <select id="turn-select">
                        <option value="w">White</option>
                        <option value="b">Black</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Evaluation Bar</label>
                    <label class="switch">
                        <input type="checkbox" id="eval-toggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <button id="new-game">New Game</button>
                <button id="take-back">Take Back</button>
                <button id="setup-board">Setup Board</button>

                <div class="panel multiplayer-panel">
                    <h2>Multiplayer</h2>
                    <div class="control-group">
                        <label>Game Mode</label>
                        <select id="game-mode">
                            <option value="bot">Play vs Bot</option>
                            <option value="human">Head to Head</option>
                        </select>
                    </div>
                    <div id="multiplayer-buttons" class="control-group hidden">
                        <button id="btn-host-open">Host Game</button>
                        <button id="btn-join-open">Join Game</button>
                    </div>
                </div>

                <!-- Host Popup -->
                <div id="popup-host" class="popup hidden">
                    <h3>Host New Game</h3>
                    <div class="control-group">
                        <label>Your Color</label>
                        <select id="host-color">
                            <option value="white">White</option>
                            <option value="black">Black</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label>Session ID</label>
                        <div class="input-row">
                            <input type="text" id="host-uuid" readonly>
                            <button id="btn-copy-uuid">Copy</button>
                        </div>
                    </div>
                    <button id="btn-host-start">Start Hosting</button>
                    <button id="btn-host-cancel" class="cancel-btn">Cancel</button>
                </div>

                <!-- Join Popup -->
                <div id="popup-join" class="popup hidden">
                    <h3>Join Game</h3>
                    <div class="control-group">
                        <label>Enter Session ID</label>
                        <input type="text" id="join-uuid" placeholder="Paste UUID here">
                    </div>
                    <button id="btn-join-start">Connect</button>
                    <button id="btn-join-cancel" class="cancel-btn">Cancel</button>
                </div>
            </div>

            <div id="checkmate-alert" class="alert hidden">
                <h3>CHECKMATE</h3>
                <p id="winner-text"></p>
                <button onclick="document.getElementById('checkmate-alert').classList.add('hidden')">Close</button>
            </div>
        </div>

        <div class="main-content">
            <div class="game-container">
                <div id="eval-bar-container">
                    <div id="eval-black-text" class="eval-text top">0.0</div>
                    <div id="eval-bar-background">
                        <div id="eval-white-fill"></div>
                    </div>
                    <div id="eval-white-text" class="eval-text bottom">0.0</div>
                </div>
                <div id="board-layout">
                    <div id="captured-top" class="captured-container">
                        <div class="captured-pieces"></div>
                        <div class="captured-score">+0</div>
                    </div>
                    <div id="board-wrapper">
                        <canvas id="chess-board"></canvas>
                        <div id="piece-picker" class="hidden">
                            <div class="picker-grid">
                                <!-- Pieces 32x32 will be here -->
                            </div>
                            <button id="close-picker">Cancel</button>
                        </div>
                    </div>
                    <div id="captured-bottom" class="captured-container">
                        <div class="captured-pieces"></div>
                        <div class="captured-score">+0</div>
                    </div>
                </div>
            </div>
        </div>

	        <div class="sidebar right-sidebar">
	            <div class="panel">
	                <h2>Moves</h2>
	                <div id="move-list"></div>
	                <button id="copy-pgn">Copy PGN</button>
	                <div id="engine-suggestion" class="suggestion-text"></div>
                <div id="engine-info" class="small-text"></div>
            </div>
        </div>
    </div>
    <script>
        const go = new Go();
        const v = "5.19-" + new Date().getTime();
        console.log("WASM: Fetching v5.19 logic...");
        fetch("main.wasm?v=" + v)
            .then(response => WebAssembly.instantiateStreaming(response, go.importObject))
            .then((result) => {
                console.log("WASM: v5.19 Loaded successfully");
                go.run(result.instance);
            });
    </script>
</body>
</html>
