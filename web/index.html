<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess (v5.15)</title>
    <link rel="stylesheet" href="style.css">
    <script src="wasm_exec.js"></script>
    <style>
        /* VERSION 5.15 - BUILD ERROR FIXED */
        body { 
            background-color: #1a1a1a !important; 
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            color: #ffffff;
        }
        #wasm-status { 
            height: 45px;
            line-height: 45px;
            background: #4b0082 !important; 
            color: #ffffff !important; 
            font-size: 1.1rem; 
            text-align: center;
            border-bottom: 3px solid #4CAF50;
            font-weight: 900;
            text-shadow: 1px 1px 2px #000;
            flex-shrink: 0;
            z-index: 9999;
        }
        #app {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="wasm-status">WASM v5.15: LOADING...</div>
    <div id="app">
        <div class="sidebar left-sidebar">
            <div class="panel">
                <h2 style="color: #4CAF50;">Settings (v5.15)</h2>
                <div class="control-group">
                    <label>Style</label>
                    <select id="style-select">
                        <option value="standard">Standard</option>
                        <option value="classic">Classic</option>
                        <option value="modern">Modern</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Bot Level (ELO)</label>
                    <select id="elo-select">
                        <option value="100">100-200</option>
                        <option value="400">200-500</option>
                        <option value="700">500-800</option>
                        <option value="900">800-1000</option>
                        <option value="1100">1000-1200</option>
                        <option value="1300">1200-1400</option>
                        <option value="1500">1400-1600</option>
                        <option value="1900">1800-2000</option>
                        <option value="2100">2000-2200</option>
                        <option value="2400">2200-2600</option>
                        <option value="2800">2600-3000</option>
                    </select>
                </div>
                <div id="setup-controls" class="control-group hidden">
                    <label>Whose Turn?</label>
                    <select id="turn-select">
                        <option value="w">White</option>
                        <option value="b">Black</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Evaluation Bar</label>
                    <label class="switch">
                        <input type="checkbox" id="eval-toggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <button id="new-game">New Game</button>
                <button id="take-back">Take Back</button>
                <button id="setup-board">Setup Board</button>
                
                <div class="panel multiplayer-panel">
                    <h2>Multiplayer</h2>
                    <div class="control-group">
                        <label>Game Mode</label>
                        <select id="game-mode">
                            <option value="bot">Play vs Bot</option>
                            <option value="human">Head to Head</option>
                        </select>
                    </div>
                    <div id="multiplayer-buttons" class="control-group hidden">
                        <button id="btn-host-open">Host Game</button>
                        <button id="btn-join-open">Join Game</button>
                    </div>
                </div>

                <!-- Host Popup -->
                <div id="popup-host" class="popup hidden">
                    <h3>Host New Game</h3>
                    <div class="control-group">
                        <label>Your Color</label>
                        <select id="host-color">
                            <option value="white">White</option>
                            <option value="black">Black</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label>Session ID</label>
                        <div class="input-row">
                            <input type="text" id="host-uuid" readonly>
                            <button id="btn-copy-uuid">Copy</button>
                        </div>
                    </div>
                    <button id="btn-host-start">Start Hosting</button>
                    <button id="btn-host-cancel" class="cancel-btn">Cancel</button>
                </div>

                <!-- Join Popup -->
                <div id="popup-join" class="popup hidden">
                    <h3>Join Game</h3>
                    <div class="control-group">
                        <label>Enter Session ID</label>
                        <input type="text" id="join-uuid" placeholder="Paste UUID here">
                    </div>
                    <button id="btn-join-start">Connect</button>
                    <button id="btn-join-cancel" class="cancel-btn">Cancel</button>
                </div>
            </div>
            
            <div id="checkmate-alert" class="alert hidden">
                <h3>CHECKMATE</h3>
                <p id="winner-text"></p>
                <button onclick="document.getElementById('checkmate-alert').classList.add('hidden')">Close</button>
            </div>
        </div>

        <div class="main-content">
            <div class="game-container">
                <div id="eval-bar-container">
                    <div id="eval-black-text" class="eval-text top">0.0</div>
                    <div id="eval-bar-background">
                        <div id="eval-white-fill"></div>
                    </div>
                    <div id="eval-white-text" class="eval-text bottom">0.0</div>
                </div>
                <div id="board-layout">
                    <div id="captured-top" class="captured-container">
                        <div class="captured-pieces"></div>
                        <div class="captured-score">+0</div>
                    </div>
                    <div id="board-wrapper">
                        <canvas id="chess-board"></canvas>
                        <div id="piece-picker" class="hidden">
                            <div class="picker-grid">
                                <!-- Pieces 32x32 will be here -->
                            </div>
                            <button id="close-picker">Cancel</button>
                        </div>
                    </div>
                    <div id="captured-bottom" class="captured-container">
                        <div class="captured-pieces"></div>
                        <div class="captured-score">+0</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="sidebar right-sidebar">
            <div class="panel">
                <h2>Analysis (v3.3 - Purple)</h2>
                <div id="move-list"></div>
                <div id="engine-suggestion" class="suggestion-text"></div>
                <div id="engine-info" class="small-text"></div>
            </div>
        </div>
    </div>
    <script>
        const go = new Go();
        const v = "5.15-" + new Date().getTime();
        console.log("WASM: Fetching v5.15 logic...");
        fetch("main.wasm?v=" + v)
            .then(response => WebAssembly.instantiateStreaming(response, go.importObject))
            .then((result) => {
                console.log("WASM: v5.15 Loaded successfully");
                go.run(result.instance);
            });
    </script>
</body>
</html>
